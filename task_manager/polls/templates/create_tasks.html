<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<title>Tasks manager</title>
		{% load static %}
		<link rel="stylesheet" type="text/css" href="{% static 'general.css' %}">
	</head>
	<body>
		<header>
			<nav>
				<a href="/sign_out" class="buttonBar">Se déconnecter</a>
                <a href="/tasks" class="buttonBar">Tâches</a>
				<a href="/teams" class="buttonBar">Equipes</a>
			</nav>
		</header>
		<div>
			<main>
				<h1>
					{% if typeTask == 0 %}Créer des tâches :{% elif typeTask == 1 %} Créer des sous-tâches : {% else %} Modifier la tâche :{% endif %}
				</h1>
				<p>
					{{ create_message }}
				</p>
				<form method="POST">
					{% csrf_token %}
					{{form.as_p}}
					<br>
					<input type="submit" value ="Envoyer"/> 
				</form>
			</main>
		</div>
	</body>
</html>
